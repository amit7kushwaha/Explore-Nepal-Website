<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Itineraries - Explore Nepal{% endblock %}</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; color: #222; }
    h1, h2, h3 { color: #1b4332; }
    .card { border: 1px solid #d8e2dc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; background: #f8faf9; }
    .badge { background: #2d6a4f; color: #fff; font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
    a { color: #1b4332; font-weight: bold; text-decoration: none; }
    .notice { margin-top: 2rem; padding: 0.75rem 1rem; background: #eef4f0; border-left: 4px solid #2d6a4f; font-size: 0.9rem; color: #333; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
  <p class="notice"><strong>Informational Guide Only:</strong> Suggested travel itineraries and day-by-day schedules are provided for informational purposes only and do not represent live bookings or confirmed reservations.</p>
</body>
</html>
