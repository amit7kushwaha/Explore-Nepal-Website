<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Nepal - Travel Inquiry</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        header { background-color: #d32f2f; color: white; padding: 20px; text-align: center; }
        .container { max-width: 650px; margin: 30px auto; padding: 25px; background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        h2 { color: #d32f2f; margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        textarea { height: 110px; resize: vertical; }
        button { background-color: #d32f2f; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background-color: #b71c1c; }
        .success-box { display: none; margin-top: 20px; padding: 15px; background-color: #e8f5e9; border-left: 4px solid #2e7d32; color: #1b5e20; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>Explore Nepal</h1>
        <p>Have a Travel Question? Send Us an Inquiry</p>
    </header>

    <div class="container">
        <h2>Travel Inquiry Form</h2>
        <p>Fill out the details below and our Nepal travel team will get back to you shortly.</p>

        <form id="inquiryForm">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone / WhatsApp (Optional)</label>
                <input type="text" id="phone" name="phone" placeholder="+977-98XXXXXXXX">
            </div>

            <div class="form-group">
                <label for="destination">Interested Destination</label>
                <select id="destination" name="destination">
                    <option value="Kathmandu Valley">Kathmandu Valley</option>
                    <option value="Pokhara">Pokhara</option>
                    <option value="Everest Region">Everest Region</option>
                    <option value="Chitwan National Park">Chitwan National Park</option>
                    <option value="Lumbini">Lumbini</option>
                    <option value="Custom / Other">Custom / Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="travelDate">Preferred Travel Month / Date</label>
                <input type="text" id="travelDate" name="travelDate" placeholder="e.g., October 2026">
            </div>

            <div class="form-group">
                <label for="message">Your Question / Travel Details *</label>
                <textarea id="message" name="message" placeholder="Ask about routes, group size, costs, or custom itineraries..." required></textarea>
            </div>

            <button type="submit">Submit Inquiry</button>
        </form>

        <div id="successBox" class="success-box">
            <strong>Inquiry Submitted!</strong> Thank you, <span id="visitorNameDisplay"></span>. Your travel query has been recorded (Status: <strong>New</strong>) and our team will reply to your email soon.
        </div>
    </div>

    <script>
        document.getElementById('inquiryForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = document.getElementById('fullName').value.trim();
            document.getElementById('visitorNameDisplay').textContent = name;
            document.getElementById('successBox').style.display = 'block';
            this.reset();
        });
    </script>

</body>
</html>
