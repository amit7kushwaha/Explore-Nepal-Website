<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Explore Nepal{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; color: #222; }
        h1, h2 { color: #1b4332; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin: 1rem 0 2rem; }
        .card { border: 1px solid #d8e2dc; border-radius: 8px; padding: 1rem; background: #f8faf9; }
        .badge { background: #2d6a4f; color: #fff; font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
        form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        input, select, button { padding: 0.45rem 0.7rem; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #1b4332; color: #fff; border: none; cursor: pointer; }
        a { color: #1b4332; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>{% block content %}{% endblock %}</body>
</html>
